name: gate

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_VERSION: '3.12'

jobs:
  check-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # https://docs.astral.sh/uv/guides/integration/github/
      - name: set up python and uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install dependencies
        run: uv sync --locked --all-extras --dev
      - name: check style
        run: uv run flake8

  check-web-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          curl -L https://github.com/biomejs/biome/releases/download/cli%2Fv1.3.3/biome-linux-x64 -o biome
          chmod +x biome
      - name: check style
        run: ./biome check app/static

  run-unit-tests:
    runs-on: ubuntu-latest
    # https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@localhost/postgres
    steps:
      - uses: actions/checkout@v4
      - name: set up python and uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install dependencies
        run: uv sync --locked --all-extras --dev
      - name: run unit tests
        run: uv run pytest --cov-report term --cov=app tests/unit

  run-system-tests:
    runs-on: ubuntu-latest
    # https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@localhost/postgres
      SECRET_KEY: abc123
      SECURITY_PASSWORD_SALT: abc123
      SECURITY_REGISTERABLE: True
      TEST_USER: "ci@gmail.com"
      TEST_PW: abc123xyz789
    steps:
      - uses: actions/checkout@v4
      - name: set up python and uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install dependencies
        run: |
          uv sync --locked --all-extras --dev
          uv run playwright install chromium
      - name: initialise db
        run: |
          ENV=CI uv run flask --app app.app db upgrade --directory app/storage/migrations
          ENV=CI uv run flask --app app.app roles create superuser
          ENV=CI uv run flask --app app.app users create $TEST_USER --password $TEST_PW -a
          ENV=CI uv run flask --app app.app roles add $TEST_USER superuser
      - name: start server
        run: |
          ENV=CI uv run flask --app app.app run & \
            sleep 3 && \
            curl http://localhost:5000 -I
      - name: run system tests
        run: |
          ENV=CI uv run pytest tests/system
