[project]
name = "fullstack-flask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "apiflask",
    "flask-admin",
    "flask-sqlalchemy",
    "flask-migrate",
    "python-dotenv",
    "loguru",
    "psycopg2",
    "alembic",
    "cryptography",
    "rich",
    "numpy",
    "pyarrow",
    "duckdb>=1.0",
    "flask-security>=5.6.2",
]

[dependency-groups]
dev = [
    "pytest",
    "flake8",
    "pytest-playwright",
    "pytest-cov",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
